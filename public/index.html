<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎵 Music Player - jymor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 20px;
      min-height: 100vh;
    }
    
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
    
    /* Player Section */
    .player-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .player-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    
    .player-wrapper iframe,
    .player-wrapper #player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    .waiting-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
      color: #888;
    }
    
    .waiting-screen .icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    
    .start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #9147ff33 100%);
      cursor: pointer;
      z-index: 10;
    }
    
    .start-overlay:hover .start-btn {
      transform: scale(1.05);
      background: #a855f7;
    }
    
    .start-btn {
      background: #9147ff;
      color: white;
      padding: 20px 40px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .start-hint {
      margin-top: 12px;
      color: #888;
      font-size: 14px;
    }
    
    .start-overlay.hidden {
      display: none;
    }
    
    .now-playing {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .now-playing-thumb {
      width: 80px;
      height: 45px;
      border-radius: 6px;
      object-fit: cover;
    }
    
    .now-playing-info {
      flex: 1;
    }
    
    .now-playing-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 4px;
    }
    
    .now-playing-meta {
      font-size: 13px;
      color: #aaa;
    }
    
    .skip-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    
    .skip-btn:hover {
      background: rgba(255,255,255,0.2);
    }
    
    /* Queue Section */
    .queue-section {
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 40px);
    }
    
    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    
    .queue-title {
      font-size: 18px;
      font-weight: 600;
    }
    
    .queue-count {
      background: #9147ff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
    }
    
    .queue-list {
      flex: 1;
      overflow-y: auto;
    }
    
    .queue-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    
    .queue-item:hover {
      background: rgba(255,255,255,0.08);
    }
    
    .queue-number {
      width: 28px;
      height: 28px;
      background: rgba(145, 71, 255, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    
    .queue-thumb {
      width: 60px;
      height: 34px;
      border-radius: 4px;
      object-fit: cover;
    }
    
    .queue-info {
      flex: 1;
      min-width: 0;
    }
    
    .queue-item-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .queue-item-user {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }
    
    .empty-queue {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }
    
    .empty-queue .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    
    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #666;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00c853;
    }
    
    .status-dot.disconnected {
      background: #ff4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Player -->
    <div class="player-section">
      <div class="player-wrapper">
        <div id="player"></div>
        <div class="waiting-screen" id="waiting-screen">
          <div class="icon">🎵</div>
          <div>En attente de musique...</div>
        </div>
        <div class="start-overlay" id="start-overlay" onclick="enableAutoplay()">
          <div class="start-btn">▶ Démarrer le Player</div>
          <div class="start-hint">Clique une fois pour activer l'autoplay</div>
        </div>
      </div>
      
      <div class="now-playing" id="now-playing" style="display: none;">
        <img class="now-playing-thumb" id="np-thumb" src="" alt="">
        <div class="now-playing-info">
          <div class="now-playing-title" id="np-title">-</div>
          <div class="now-playing-meta">
            <span id="np-author">-</span> • Demandé par <span id="np-user">-</span>
          </div>
        </div>
        <button class="skip-btn" onclick="skip()">Passer ⏭</button>
      </div>
    </div>
    
    <!-- Queue -->
    <div class="queue-section">
      <div class="queue-header">
        <div class="queue-title">File d'attente</div>
        <div class="queue-count" id="queue-count">0</div>
      </div>
      
      <div class="queue-list" id="queue-list">
        <div class="empty-queue">
          <div class="icon">📭</div>
          <div>La file d'attente est vide</div>
        </div>
      </div>
      
      <div class="status-bar">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Connecté</span>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    
    let player = null;
    let playerReady = false;
    let autoplayEnabled = false;
    let currentSong = null;
    let queue = [];
    
    // Enable autoplay after user clicks button
    function enableAutoplay() {
      autoplayEnabled = true;
      document.getElementById('start-overlay').classList.add('hidden');
      if (currentSong && playerReady) {
        player.loadVideoById(currentSong.videoId);
        player.playVideo();
      }
    }
    
    // YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
    
    window.onYouTubeIframeAPIReady = function() {
      player = new YT.Player('player', {
        playerVars: {
          autoplay: 1,
          controls: 1,
          rel: 0,
          modestbranding: 1
        },
        events: {
          onReady: () => {
            playerReady = true;
            console.log('Player ready');
          },
          onStateChange: onPlayerStateChange
        }
      });
    };
    
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        socket.emit('song-ended');
      }
    }
    
    // Socket events
    socket.on('connect', () => {
      document.getElementById('status-dot').classList.remove('disconnected');
      document.getElementById('status-text').textContent = 'Connecté';
    });
    
    socket.on('disconnect', () => {
      document.getElementById('status-dot').classList.add('disconnected');
      document.getElementById('status-text').textContent = 'Déconnecté';
    });
    
    socket.on('queue-update', (data) => {
      queue = data.queue;
      
      // New current song?
      if (data.currentSong && (!currentSong || currentSong.id !== data.currentSong.id)) {
        currentSong = data.currentSong;
        if (playerReady) {
          playSong(currentSong);
        }
      } else if (!data.currentSong) {
        currentSong = null;
        showWaiting();
      }
      
      renderQueue();
    });
    
    function playSong(song) {
      document.getElementById('waiting-screen').style.display = 'none';
      document.getElementById('now-playing').style.display = 'flex';
      
      document.getElementById('np-thumb').src = song.thumbnail;
      document.getElementById('np-title').textContent = song.title;
      document.getElementById('np-author').textContent = song.author;
      document.getElementById('np-user').textContent = song.user;
      
      if (autoplayEnabled) {
        player.loadVideoById(song.videoId);
        player.playVideo();
      }
    }
    
    function showWaiting() {
      document.getElementById('waiting-screen').style.display = 'flex';
      document.getElementById('now-playing').style.display = 'none';
    }
    
    function renderQueue() {
      const container = document.getElementById('queue-list');
      document.getElementById('queue-count').textContent = queue.length;
      
      if (queue.length === 0) {
        container.innerHTML = `
          <div class="empty-queue">
            <div class="icon">📭</div>
            <div>La file d'attente est vide</div>
          </div>
        `;
        return;
      }
      
      container.innerHTML = queue.map((song, i) => `
        <div class="queue-item">
          <div class="queue-number">${i + 1}</div>
          <img class="queue-thumb" src="${song.thumbnail}" alt="">
          <div class="queue-info">
            <div class="queue-item-title">${escapeHtml(song.title)}</div>
            <div class="queue-item-user">👤 ${escapeHtml(song.user)}</div>
          </div>
        </div>
      `).join('');
    }
    
    function skip() {
      socket.emit('request-next');
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
