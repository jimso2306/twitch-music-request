<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Now Playing Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', sans-serif;
      background: transparent;
      overflow: hidden;
    }
    
    .overlay {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 380px;
    }
    
    .overlay.visible {
      display: flex;
    }
    
    .thumbnail {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }
    
    .info {
      flex: 1;
      min-width: 0;
      padding-right: 8px;
    }
    
    .title {
      font-size: 14px;
      font-weight: 600;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    
    .artist {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    
    .requester {
      font-size: 11px;
      color: #9147ff;
    }
    
    .sound-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 24px;
      flex-shrink: 0;
    }
    
    .bar {
      width: 4px;
      background: #9147ff;
      border-radius: 2px;
      animation: soundBar 0.8s ease-in-out infinite;
    }
    
    .bar:nth-child(1) { animation-delay: 0s; }
    .bar:nth-child(2) { animation-delay: 0.2s; }
    .bar:nth-child(3) { animation-delay: 0.4s; }
    .bar:nth-child(4) { animation-delay: 0.1s; }
    
    @keyframes soundBar {
      0%, 100% { height: 8px; }
      50% { height: 24px; }
    }
  </style>
</head>
<body>
  <div class="overlay" id="overlay">
    <img class="thumbnail" id="thumbnail" src="" alt="">
    <div class="info">
      <div class="title" id="title"></div>
      <div class="artist" id="artist"></div>
      <div class="requester" id="requester"></div>
    </div>
    <div class="sound-bars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    
    socket.on('queue-update', (data) => {
      const overlay = document.getElementById('overlay');
      
      if (data.currentSong) {
        document.getElementById('thumbnail').src = data.currentSong.thumbnail;
        document.getElementById('title').textContent = data.currentSong.title;
        document.getElementById('artist').textContent = data.currentSong.author;
        document.getElementById('requester').textContent = `Requested by ${data.currentSong.user}`;
        overlay.classList.add('visible');
      } else {
        overlay.classList.remove('visible');
      }
    });
  </script>
</body>
</html>
